# icon|command|interval_seconds
BAT|cat /sys/class/power_supply/BAT0/capacity 2>/dev/null | awk '{print $1"%"}' || echo n/a|30
CPU|top -bn1 | awk '/Cpu\(s\)/ {print int($2+$4)"%"; exit}'|5
MEM|free -h | awk '/^Mem:/ {print $3"/"$2}'|10
VOL|pactl get-sink-volume @DEFAULT_SINK@ 2>/dev/null | awk 'NR==1{print $5}' || amixer get Master | awk -F'[][]' 'END{print $2}'|5
DATE|date '+%a %d %b %H:%M'|30
